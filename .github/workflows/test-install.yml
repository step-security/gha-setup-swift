name: Test install

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  install-swift:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.actor == 'dependabot[bot]' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}

    name: Test Swift toolchain install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: step-security/gha-setup-vsdevenv@4162789192a5d25127383e0c2c7ff1d184c6fead # v6.0.1
      if: ${{ runner.os == 'windows' }}

    - name: Install Swift
      uses: ./
      with:
        swift-version: development
        swift-build: DEVELOPMENT-SNAPSHOT-2025-08-26-a

    - name: Check Swift version
      run: swift --version

    - name: Install pre-requisites for smoke test
      if: ${{ runner.os == 'macOS' }}
      run: brew install ninja

    - name: Install pre-requisites for smoke test
      if: ${{ runner.os == 'Linux' }}
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Smoke test
      run: |
        cmake -B build -G Ninja -S .github/smoke-test
        cmake --build build

  windows-installer-args:
    name: Test installer arguments on Windows
    runs-on: windows-latest

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: step-security/gha-setup-vsdevenv@4162789192a5d25127383e0c2c7ff1d184c6fead # v6.0.1

    - name: Install Swift without the IDE component
      uses: ./
      with:
        swift-version: development
        swift-build: DEVELOPMENT-SNAPSHOT-2025-08-26-a
        installer-args: OptionsInstallIDE=0 

    - name: Assert that we find swiftc.exe
      run: Get-Command swiftc.exe

    - name: Assert that we don't find sourcekit-lsp.exe
      shell: pwsh
      run: |
        -not (Get-Command sourcekit-lsp.exe -ErrorAction SilentlyContinue)

  windows-update-sdk-modules:
    name: Test SDK module updates on Windows
    runs-on: windows-latest

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: step-security/gha-setup-vsdevenv@4162789192a5d25127383e0c2c7ff1d184c6fead # v6.0.1

    - name: Install Swift with SDK module updates
      uses: ./
      with:
        swift-version: development
        swift-build: DEVELOPMENT-SNAPSHOT-2025-08-26-a
        update-sdk-modules: true

    - name: Verify Swift installation
      run: swift --version

    - name: Smoke test
      run: |
        swift package init --type executable
        swift build
